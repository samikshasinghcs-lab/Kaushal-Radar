:root{--ink:#0F1E3C;--mut:#5b6b82;--bg:#f4f7fc;--card:#fff;--ln:#d5dfee;--acc:#189787;--gold:#F6BE3D}

header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--ln)}

nav button.on,.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:14px 16px;max-width:1200px;margin:auto}.row{display:flex;gap:14px;flex-wrap:wrap}.col{flex:1 1 340px;min-width:0}
.card{overflow-x:auto;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.03em}
table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
.band{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.b1{background:#7F0000;color:#fff}.b2{background:#E34A33;color:#fff}.b3{background:#FDBB84}.b4{background:#FEE8C8}
.note{color:var(--mut);font-size:12px}.warn{background:#FFF4D6;border:1px solid var(--gold);border-radius:8px;padding:8px 10px;margin:8px 0}
.ok{color:#0a7a3d;font-weight:700}.bad{color:#b3261e;font-weight:700}select,input,textarea{font:inherit;padding:6px;border:1px solid var(--ln);border-radius:8px;max-width:100%}
svg{width:100%;height:auto;max-height:560px}svg path{stroke:#fff;stroke-width:.8;cursor:pointer}svg path:hover{stroke:var(--ink);stroke-width:2}svg path.sel{stroke:#000;stroke-width:3}
.lg span{display:inline-block;margin-right:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rt li{margin:4px 0}pre{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:8px;margin:6px 0}
@media print{header,nav,.noprint{display:none}}
#cap{position:fixed;left:0;right:0;bottom:0;background:#0F1E3C;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));font-size:16px;display:none;z-index:9;gap:12px;align-items:center}#cap b{flex:1}</style></head><body>

const flags=r=>{const f=[];if(r.z_wpm>=2)f.push('Workers per micro unit '+fmt(r.wpm,1)+' vs state median 9.3 (robust z '+fmt(r.z_wpm,1)+')');if(r.z_dens>=3)f.push('Reported MSME jobs '+fmt(r.msme_jobs_per_1000,0)+' per 1,000 residents (robust z '+fmt(r.z_dens,1)+'): commuter or registration effect');return f};
const stT=(den)=>{const g=D.reduce((a,r)=>a+r['Grand Total'],0),p=D.reduce((a,r)=>a+(den==='imp'?r.implied_pop:r.pop2011),0);return g/p*1000};
const NAV=[['map','1 State map'],['dist','2 District'],['cmp','3 Compare'],['conf','4 Data confidence'],['led','5 Decision ledger'],['ev','6 Evidence (vision)']];
function nav(){document.getElementById('nav').innerHTML=NAV.map(([k,t])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')+`<button class="btn noprint" onclick="window.print()" style="margin-left:auto">Print / PDF</button>`}
function go(v,k){S.view=v;if(k)S.sel=k;render()}
function render(){nav();document.getElementById('strip').textContent='State average '+fmt(stT(S.den))+' registrants per 1,000. Act on the band, not the exact rank.';
 document.getElementById('view').innerHTML=(S.use==='iti'&&['map','dist','cmp'].includes(S.view))?itiLock()+'<div class="card note">DGPI views are disabled for ITI and diploma planning. Switch Planning for back to Graduate programmes, or load NCVT supply data.</div>':{map:vMap,dist:vDist,cmp:vCmp,conf:vConf,led:vLed,ev:vEv}[S.view]()}
document.getElementById('den').onchange=e=>{S.den=e.target.value;render()};document.getElementById('use').onchange=e=>{S.use=e.target.value;render()};
function itiLock(){return S.use==='iti'?`<div class="warn"><b>ITI / diploma planning lock.</b> Yuvanidhi registrants are 98.5% degree holders, so DGPI is not used for ITI seats. Use NCVT supply and vacancy data (not loaded in this prototype).</div>`:''}
function vMap(){const top=[...D].sort((a,b)=>RK(a)-RK(b)).slice(0,8);
 const paths=P.map(p=>{const r=by(p.key);const b=r?band(r):4;return `<path d="${p.d}" fill="${r?BC[b]:'#ddd'}" class="${p.key===S.sel?'sel':''}" onclick="go('dist','${p.key}')"><title>${p.nm}${r?': '+fmt(V(r))+' ('+BN[b]+')':''}</title></path>`}).join('');
 return itiLock()+`<div class="row"><div class="col card" ${S.use==='iti'?'style="opacity:.35"':''}><h2>Graduate registration pressure, by rank band</h2><svg viewBox="${VB}">${paths}</svg>
 <div class="lg note">${[1,2,3,4].map(i=>`<span><i style="background:${BC[i]}"></i>${BN[i]}</span>`).join('')}</div>
 <div class="note">Map uses 2011 boundaries: Vijayanagara sits inside Ballari and Harapanahalli inside Davanagere. Select Vijayanagara from the list on the District page.</div></div>
 <div class="col"><div class="card"><h2>Diagnostic queue (top 8 of 31)</h2><table><tr><th>#</th><th>District</th><th>DGPI</th><th>In top 8 in</th></tr>${top.map(r=>`<tr onclick="go('dist','${r.key}')" style="cursor:pointer"><td>${RK(r)}</td><td>${r.name}${r.kk?' <span class="note">(KK)</span>':''}</td><td>${fmt(V(r))}</td><td>${fmt(P8(r),0)}% of draws</td></tr>`).join('')}</table>
 <div class="note">Draws: population multiplied by a random factor in 0.85 to 1.15, 5,000 times. KK = Kalyana-Karnataka. A flag triggers a diagnosis, never funding.</div></div>
 <div class="card"><h2>Why this is a signal, not a verdict</h2><div class="note">Registrants are 2022-23 pass-outs who registered for the scheme (domicile, 180 days unemployed). Low counts in Bengaluru may reflect domicile and migration. Capacity moves only when independent supply and vacancy data corroborate.</div></div></div></div>`}
function opts(sel){return D.map(r=>`<option value="${r.key}" ${r.key===sel?'selected':''}>${r.name}</option>`).join('')}
function route(r){const q=RK(r)<=8,hi=r.msme_jobs_per_1000>=medDens;
 if(!q)return ['Not in the diagnostic queue','Monitor with the quarterly refresh.'];
 return hi?['High registrations + high reported MSME job density','Investigate graduate outcomes, occupational fit, wages and hiring access before diagnosing a relevance or linkage gap.']:['High registrations + low reported MSME job density','Investigate vacancies, formal employment and training-seat supply before diagnosing a capacity gap.']}
function brief(r){const t=`${r.name}: ${fmt(V(r))} registrants per 1,000 residents (${S.den==='imp'?'implied population':'Census 2011 population'}), rank ${RK(r)} of 31, band: ${BN[band(r)]}. State average ${fmt(stT(S.den))}. ${r['Grand Total']} registrants from the 2022-23 pass-out cohort. In the top 8 in ${fmt(P8(r),0)}% of 5,000 population-error draws. This is a registration signal, not unemployment.`;
 const ok=new Set([V(r),RK(r),31,8,stT(S.den),r['Grand Total'],P8(r),5000,2022,23,1000].map(x=>+fmt(x,2)));
 const nums=(t.match(/\d[\d,]*\.?\d*/g)||[]).map(x=>+x.replace(/,/g,''));const bad=nums.filter(n=>![...ok].some(o=>Math.abs(o-n)<0.011));
 return {t,n:nums.length,bad}}
function vDist(){const r=by(S.sel),b=band(r),rt=route(r),f=flags(r),br=brief(r);
 return itiLock()+`<div class="row"><div class="col"><div class="card"><h2>District</h2><select onchange="go('dist',this.value)">${opts(S.sel)}</select>
 <h3 style="margin:10px 0 4px">${r.name} <span class="band b${b}">${BN[b]}</span> ${f.length?'<span class="band" style="background:#FFF4D6;border:1px solid #F6BE3D">Low data confidence</span>':'<span class="band" style="background:#e6f4ea">Data checks passed</span>'}</h3>
 <table><tr><th>Measure</th><th>Implied pop.</th><th>Census 2011 pop.</th></tr>
 <tr><td>Registrants per 1,000</td><td>${fmt(r.dgpi_per_1000)}</td><td>${fmt(r.dgpi_census)}</td></tr>
 <tr><td>Rank of 31</td><td>${r.rk_dgpi_per_1000}</td><td>${r.rk_dgpi_census}</td></tr>
 <tr><td>In top 8 across draws</td><td>${fmt(r.p8_imp,0)}%</td><td>${fmt(r.p8_cen,0)}%</td></tr></table>
 <div class="note">Rank agrees across denominators when the two ranks are close. ${Math.abs(r.rk_dgpi_per_1000-r.rk_dgpi_census)>=3?'<b>Ranks differ here: treat as a band.</b>':''}</div></div>
 <div class="card"><h2>Why flagged: drivers</h2><ul class="rt"><li>Per capita income Rs ${fmt(r.income_lakh)} lakh (state average 3.86 lakh)</li><li>Registrants ${r['Grand Total']}; reported MSME jobs ${r['Total Employed'].toLocaleString()} (${fmt(r.msme_jobs_per_1000,0)} per 1,000 residents; median ${fmt(medDens,0)})</li><li>Services share of state output ${r['Services (%)']}%</li></ul></div></div>
 <div class="col"><div class="card"><h2>Diagnostic routing: next question</h2><b>${rt[0]}</b><div>${rt[1]}</div><div class="warn">Corroboration Gate: capacity moves only if supply, vacancy and outcome data agree with the signal.</div>
 <div class="note">Peer districts with similar income and MSME density: ${r.peers.join(', ')}. Compare what differs.</div></div>
 <div class="card"><h2>Data confidence</h2>${f.length?'<ul class="rt">'+f.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="note">Flagged for review by the District Statistical Officer. A flag never removes a district from funding.</div>':'No rule fired. Sum checks pass for all 31 districts.'}</div>
 <div class="card"><h2>District brief (template-generated; every number checked)</h2><pre id="brief">${br.t}</pre><div>Claim check: <span class="${br.bad.length?'bad':'ok'}">${br.n-br.bad.length} of ${br.n} numbers verified against the engine${br.bad.length?'; rejected: '+br.bad.join(', '):''}</span></div>
 <div class="noprint" style="margin-top:8px"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('brief').textContent)">Copy brief</button> <button class="btn pri" onclick="go('led','${r.key}')">Log a decision</button></div></div></div></div>`}
function vCmp(){const a=by(S.a),b=by(S.b),row=(l,f)=>`<tr><td>${l}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
 return `<div class="card"><h2>Compare two districts</h2><select onchange="S.a=this.value;render()">${opts(S.a)}</select> vs <select onchange="S.b=this.value;render()">${opts(S.b)}</select>
 <table><tr><th>Measure</th><th>${a.name}</th><th>${b.name}</th></tr>${row('Registrants per 1,000 (selected denominator)',r=>fmt(V(r)))}${row('Band',r=>BN[band(r)])}${row('Rank of 31',r=>RK(r))}${row('In top 8 across draws',r=>fmt(P8(r),0)+'%')}${row('Per capita income (Rs lakh)',r=>fmt(r.income_lakh))}${row('Reported MSME jobs per 1,000',r=>fmt(r.msme_jobs_per_1000,0))}${row('Routing',r=>route(r)[0])}${row('Data flags',r=>flags(r).length||'none')}</table></div>`}
function vConf(){const fl=D.filter(r=>flags(r).length);
 return `<div class="card"><h2>Data confidence and audit</h2><table><tr><th>Rule</th><th>What it checks</th><th>Result</th></tr>
 <tr><td>R1 Internal sums</td><td>Micro + small + medium = total (employment and units)</td><td class="ok">31 of 31 pass</td></tr>
 <tr><td>R2 Workers per micro unit</td><td>Robust z of the ratio, flag at 2.0</td><td>${D.filter(r=>r.z_wpm>=2).map(r=>r.name).join(', ')||'none'}</td></tr>
 <tr><td>R3 MSME jobs per 1,000 residents</td><td>Robust z, flag at 3.0</td><td>${D.filter(r=>r.z_dens>=3).map(r=>r.name).join(', ')||'none'}</td></tr>
 <tr><td>R4 Population denominator</td><td>Implied vs Census 2011 rank gap of 5 or more</td><td>${D.filter(r=>Math.abs(r.rk_dgpi_per_1000-r.rk_dgpi_census)>=5).map(r=>r.name).join(', ')}</td></tr></table>
 <div class="note">Measured on injected errors: sum checks caught every error in summed fields; the ratio rule alone caught about half of 10x errors and none at 1.5x. Consistent but wrong values are not detectable here. Your deck also flags Chamarajanagar: add its rule from your script.</div></div>
 <div class="card"><h2>Open flags (status: needs review)</h2><table><tr><th>District</th><th>Reason</th><th>Owner</th><th>Status</th></tr>${fl.map(r=>`<tr><td>${r.name}</td><td>${flags(r).join('; ')}</td><td>District Statistical Officer / DES</td><td>Open</td></tr>`).join('')}</table></div>`}

function vEv(){const r=by(S.sel);const st=['Insufficient evidence','Signal corroborated','Signals diverge','Evidence contradicts action','Authority approved'];
 const L={live:['LIVE in this prototype','#e6f4ea'],pub:['PUBLIC, not yet ingested','#FFF4D6'],acc:['ACCESS NEEDED (approval, data contract)','#fde7e4'],ctx:['CONTEXT ONLY','#e8eef9']};
 const EV=[['Yuva Nidhi registrations','Where is registration pressure high? ('+r.name+': '+fmt(V(r))+' per 1,000)','live','2022-23 cohort; take-up, not unemployment'],
 ['MSME employment (DES)','How large is the local productive base? ('+fmt(r.msme_jobs_per_1000,0)+' reported jobs per 1,000)','live','Registration-based, workplace location'],
 ['PLFS district labour snapshot (MoSPI, Jan-Dec 2025)','Independent survey lens: unemployment, participation, NEET','pub','Stand-alone district estimates only for the largest districts; others in NSS regions. Show precision (RSE)'],
 ['AISHE 2023-24','How many students does the education pipeline produce?','pub','Institution location is not graduate home district'],
 ['ITI / NCVT / KSDC training supply','What capacity exists and is it used?','acc','Check year, trade code, institution status'],
 ['Yuva Udyoga Sethu and NCS vacancies','What do employers actually ask for?','acc','Portal coverage only; deduplicate and validate'],
 ['Placement, joining, retention outcomes','Do programmes lead to work?','acc','Needs data sharing, definitions and follow-up window'],
 ['e-Shram and EPFO','Workforce structure: informal and formal context','ctx','Not unemployment registers; geography may not be district']];
 return `<div class="warn"><b>Vision mock-up.</b> Only two feeds are live today (Yuva Nidhi, MSME). Every other card shows what it would add and how it is accessed. Nothing here is integrated, and no composite score is computed.</div>
 <div class="card"><h2>Corroboration Gate for ${r.name}</h2><select onchange="S.sel=this.value;render()">${opts(S.sel)}</select>
 <div style="margin:10px 0">${st.map((s,i)=>`<span class="band" style="margin:2px;${i===0?'background:#7F0000;color:#fff':'background:#e8eef9'}">${i+1}. ${s}</span>`).join('')}</div>
 <div><b>Current state: Insufficient evidence.</b> One administrative signal exists; independent supply, demand and outcome evidence is absent. <b>Permitted action:</b> open a diagnosis and request the missing data. <b>Training-capacity change: blocked.</b></div></div>
 <div class="row">${EV.map(e=>`<div class="col card" style="flex:1 1 300px"><h2>${e[0]}</h2><div class="band" style="background:${L[e[2]][1]}">${L[e[2]][0]}</div><p><b>Question:</b> ${e[1]}</p><div class="note">${e[3]}</div></div>`).join('')}</div>`}
function vLed(){const rows=S.ledger.map(e=>`<tr><td>${e.date}</td><td>${e.d}</td><td>${e.type}</td><td>${e.who}</td><td>${e.ev}</td><td>${e.status}</td></tr>`).join('')||'<tr><td colspan="6" class="note">No decisions logged yet. Each entry later gets an outcome, so we can learn whether a flag led to improvement.</td></tr>';
 return `<div class="card"><h2>Decision ledger</h2><div class="noprint" style="display:flex;flex-wrap:wrap;gap:8px"><select id="ld">${opts(S.sel)}</select>
 <select id="lt"><option>Open diagnosis</option><option>Change training capacity</option><option>Commission sector review</option><option>Data audit</option></select>
 <input id="lw" placeholder="Decision-maker (name, dept)"><select id="le"><option>Corroborated by supply, vacancy and outcome data</option><option>Not yet corroborated</option></select><button class="btn pri" onclick="addL()">Add</button></div><div id="lmsg"></div>
 <table style="margin-top:8px"><tr><th>Date</th><th>District</th><th>Decision</th><th>Decision-maker</th><th>Evidence</th><th>Outcome</th></tr>${rows}</table>
 <div class="note">Prototype ledger: stored in this browser (localStorage). A production ledger needs an authorised backend, access control and audit logs.</div></div>`}
function addL(){const d=document.getElementById('ld').value,t=document.getElementById('lt').value,w=document.getElementById('lw').value||'unassigned',e=document.getElementById('le').value;
 if(t==='Change training capacity'&&e.startsWith('Not')){document.getElementById('lmsg').innerHTML='<div class="warn"><b>Corroboration Gate: blocked.</b> Capacity cannot change until supply, vacancy and outcome data agree with the signal. Log an open diagnosis instead.</div>';return}
 S.ledger.push({date:new Date().toISOString().slice(0,10),d:by(d).name,type:t,who:w,ev:e.startsWith('Not')?'Not yet corroborated':'Corroborated',status:'Pending'});try{localStorage.setItem('kr_ledger',JSON.stringify(S.ledger))}catch(x){}render()}
let DEMO=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function cap(t){const c=document.getElementById('cap');c.style.display=t?'flex':'none';document.getElementById('capt').textContent=t||''}
function stopDemo(){DEMO++;cap('');setState('imp','grad')}
function setState(den,use){S.den=den;S.use=use;document.getElementById('den').value=den;document.getElementById('use').value=use}
async function playDemo(ms){ms=ms||6500;const my=++DEMO,ok=()=>my===DEMO;
 setState('imp','grad');
 const steps=[()=>{go('map');cap('1. State map in rank bands. Act on the band, not the exact rank.')},
 ()=>{go('dist','raichur');cap('2. Raichur: why it is flagged, how sure we are, and the next question to ask.')},
 ()=>{setState('cen','grad');render();cap('3. Toggle the denominator: same district on Census 2011 population.')},
 ()=>{setState('imp','grad');go('led','raichur');document.getElementById('lt').value='Change training capacity';document.getElementById('le').selectedIndex=1;addL();cap('4. Corroboration Gate: capacity cannot change until the evidence agrees.')},
 ()=>{go('dist','raichur');cap('5. Every number in the brief is checked against the engine.')},
 ()=>{go('ev','raichur');cap('6. Vision: each future source is an evidence card. Only two are live; the gate stays blocked until more agree.')},
 ()=>{setState('imp','iti');render();cap('7. ITI planning disables the index: 98.5% of registrants are degree holders.')},
 ()=>{setState('imp','grad');go('map');cap("Don't rank districts. Route decisions.")}];
 for(const s of steps){if(!ok())return;s();await sleep(ms)}
 if(ok())stopDemo()}
render();
</script></body></html>
